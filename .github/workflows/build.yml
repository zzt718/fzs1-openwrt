# ============================================================================
#  fzs1-openwrt —— GitHub Actions 在线编译
#
#  ⚠️ 定位：本仓的正式发版仍是「本地编译 + 手工发 Release」，**不依赖这条工作流**。
#     它主要给想自己编的人（含 fork 出去的人）用：跑的就是同一套 build.sh，产出等价。
#
#  触发方式：
#    - 手动：Actions 页面 → Build firmware → Run workflow
#    - 打标签：git tag v1.0.0 && git push --tags  → 自动编译并发布到 Release
#
#  产物：openwrt-ramips-mt76x8-mibox_668m2-squashfs-sysupgrade.bin (+ initramfs)
#
#  ⚠️ 首次启用须知：
#   - 编译需 1~2 小时（公开仓库不计费）；
#   - 首次运行会缓存 OpenWrt 源码与工具链（约 2~4GB，用 cache 加速后续构建）；
#   - 需在仓库设置里给 Actions 读写权限（Settings → Actions → General →
#     Workflow permissions → Read and write），否则打 tag 时发不了 Release。
# ============================================================================
name: Build firmware

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write      # 打 tag 时需要发布 Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        # OpenWrt 全量编译要 20GB 以上，runner 默认余量不够，先清掉预装的 SDK
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time \
            libelf-dev

      - name: Cache OpenWrt source & toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/fzs1-openwrt-build/openwrt/dl
            ~/fzs1-openwrt-build/openwrt/staging_dir
          key: fzs-openwrt-${{ hashFiles('src/config.seed.v2') }}
          restore-keys: |
            fzs-openwrt-

      - name: Clone OpenWrt source
        run: bash build.sh clone

      - name: Inject board files & panel
        run: bash build.sh inject

      - name: Configure
        run: bash build.sh config

      - name: Build
        run: bash build.sh build

      - name: Show artifacts
        run: |
          ls -lh build/
          sha256sum build/*.bin || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fzs1-openwrt-firmware
          path: build/*.bin
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.bin
          generate_release_notes: true
